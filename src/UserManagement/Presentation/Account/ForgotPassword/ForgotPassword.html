<div class="fp-page">
  <div class="fp-card">

    <h1>Forgot Password</h1>

    <!-- STEP 1: Email daalke OTP mangwana -->
    <form *ngIf="step === 1" [formGroup]="emailForm" (ngSubmit)="sendOtp()">
      <p class="fp-sub">Apna registered email daalein, hum aapko OTP bhejenge.</p>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
      </div>

      <div class="error-message" *ngIf="errormessage">{{ errormessage }}</div>
      <div class="success-message" *ngIf="successmessage">{{ successmessage }}</div>

      <button type="submit" class="fp-btn">Send OTP</button>
    </form>

    <!-- STEP 2: OTP + naya password -->
    <form *ngIf="step === 2" [formGroup]="resetForm" (ngSubmit)="resetPassword()">
      <p class="fp-sub">Email par mila OTP aur naya password daalein.</p>

      <div class="form-group">
        <label for="otp">OTP</label>
        <input id="otp" type="text" formControlName="otp" placeholder="Enter OTP" />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" placeholder="Enter new password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Confirm new password" />
      </div>

      <div class="error-message" *ngIf="errormessage">{{ errormessage }}</div>
      <div class="success-message" *ngIf="successmessage">{{ successmessage }}</div>

      <button type="submit" class="fp-btn">Reset Password</button>
    </form>

    <a routerLink="/login" class="fp-back">← Back to Login</a>

  </div>
</div>
